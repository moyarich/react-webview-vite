name: Format dependency explorer preview

on:
  push:
    branches:
      - feat/dependency-explorer-ui

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/dependency-explorer-ui
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier previews/index.html README.md --write
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews/index.html README.md
          git commit -m "style: format preview workspace docs"
          git push origin HEAD:feat/dependency-explorer-ui
