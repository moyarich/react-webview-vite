name: Release Drafter

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  update-release-draft:
    name: Update release draft
    runs-on: ubuntu-latest

    steps:
      - name: Detect release history
        id: release-history
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          published_release_count="$(
            gh api --paginate "repos/$GH_REPO/releases?per_page=100" |
              jq -s 'add | map(select(.draft == false)) | length'
          )"

          echo "published-release-count=$published_release_count" >> "$GITHUB_OUTPUT"

      - name: Find initial comparison baseline
        id: initial-baseline
        if: steps.release-history.outputs.published-release-count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          first_pr="$(
            gh api --paginate               "repos/$GH_REPO/pulls?state=closed&base=main&sort=created&direction=asc&per_page=100" |
              jq -s 'add | map(select(.merged_at != null)) | sort_by(.merged_at) | first | .number'
          )"

          if [[ -z "$first_pr" || "$first_pr" == "null" ]]; then
            echo "No merged pull request targeting main was found." >&2
            exit 1
          fi

          first_commit="$(
            gh api --paginate "repos/$GH_REPO/pulls/$first_pr/commits?per_page=100" |
              jq -s 'add | first | .sha'
          )"

          if [[ -z "$first_commit" || "$first_commit" == "null" ]]; then
            echo "No commits were found for pull request #$first_pr." >&2
            exit 1
          fi

          baseline="$(
            gh api "repos/$GH_REPO/commits/$first_commit"               --jq '.parents[0].sha // empty'
          )"

          if [[ -z "$baseline" ]]; then
            echo "The first commit in pull request #$first_pr has no parent commit to use as a baseline." >&2
            exit 1
          fi

          echo "First merged PR: #$first_pr"
          echo "First PR commit: $first_commit"
          echo "Initial comparison baseline: $baseline"

          echo "from=$baseline" >> "$GITHUB_OUTPUT"

      - name: Update initial draft release
        if: steps.release-history.outputs.published-release-count == '0'
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          from: ${{ steps.initial-baseline.outputs.from }}

      - name: Update draft release
        if: steps.release-history.outputs.published-release-count != '0'
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
