name: Format preview router branch

on:
  push:
    branches:
      - feat/preview-react-router

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/preview-react-router
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews README.md vite.webview.config.ts package.json package-lock.json tsconfig.preview.json
          git commit -m "style: format preview router"
          git push origin HEAD:feat/preview-react-router
