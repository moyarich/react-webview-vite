name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: Features
    semver-increment: minor
    when:
      labels:
        - feature
        - enhancement

  - title: Fixes
    semver-increment: patch
    when:
      labels:
        - fix
        - bug
        - bugfix

  - title: Documentation
    when:
      labels:
        - documentation
        - docs

  - title: Maintenance
    when:
      labels:
        - chore
        - dependencies

  - type: pre-exclude
    when:
      label: skip-changelog

  - type: version-resolver
    semver-increment: major
    when:
      label: major

  - type: version-resolver
    semver-increment: patch

change-template: "- $TITLE (#$NUMBER) $AUTHORS"

no-changes-template: |
  * No changes

  ---
  > [!WARNING]
  > Release Drafter could not find a previous **published release** for `moyarich/vscode-dependency-links`. This draft was created **without a comparison baseline**.

  > [!IMPORTANT]
  > Treat this draft as a manual starting point.
  > Review the proposed version, tag, and notes before publishing.

  If you did not expect this to happen, [open an issue](https://github.com/release-drafter/release-drafter/issues/new?template=previous-published-release-not-found.yml).

  ---

template: |
  ## Changes

  $CHANGES
